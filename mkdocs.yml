site_name: Swipe2Try Documentation
site_description: Complete documentation for the Swipe2Try application architecture, authentication, and implementation patterns.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: Architecture.md
  - Security:
    - Authentication: Authentication.md
    - Authorization: Authorization.md
  - Implementation Patterns:
    - Tuple Return Types: TupleReturnTypePattern.md
  - Diagrams:
    - Overview: diagrams/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true
