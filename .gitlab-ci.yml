# GitLab CI/CD configuration for .NET Razor Pages application
# Build and test only - no deployment

image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - build
  - test

variables:
  # Disable the .NET telemetry data collection
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

# Use GitLab's built-in caching to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - "*/obj/project.assets.json"
    - "*/obj/*.csproj.nuget.*"
    - ".nuget/packages"

build:
  stage: build
  script:
    - dotnet restore
    - dotnet build --configuration Release --no-restore
  artifacts:
    name: "build-${CI_COMMIT_REF_NAME}"
    paths:
      - "*/bin/Release/**"

test:
  stage: test
  dependencies:
    - build
  script:
    - |
      if find . -name "*.Tests.csproj" -o -name "*Tests.csproj" | grep -q .; then
        dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --logger:"junit;LogFilePath=junit-testresults.xml"
      else
        echo "No test projects found. Skipping tests."
      fi
  coverage: '/(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: junit-testresults.xml
    paths:
      - "*/TestResults/*/coverage.cobertura.xml"
      - "junit-testresults.xml"

# Only run the pipeline on main branch, tags, and merge requests
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG